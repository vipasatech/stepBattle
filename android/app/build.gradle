plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
    id "com.google.gms.google-services"
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace = "com.stepbattle.stepbattle"
    // Bumped 35 → 36 on 2026-09-04: Play Console started blocking uploads
    // that target below API 36 (Android 16). AGP was simultaneously bumped
    // 8.2.2 → 8.7.0 (settings.gradle) + Gradle wrapper 8.3 → 8.9 to allow
    // compileSdk 36. Flutter itself stays pinned at 3.27.1 (iOS integration
    // depends on it — see project_ios_firebase_runtime memory).
    compileSdk = 36
    ndkVersion = flutter.ndkVersion

    compileOptions {
        // `flutter_local_notifications` >= 18 uses java.time APIs that aren't
        // available below API 26 without desugaring. Even though our minSdk is
        // 26 (so the runtime ships them), AGP still enforces the AAR-metadata
        // requirement → desugaring must be enabled. Library coords pinned to
        // the version flutter_local_notifications publishes against.
        coreLibraryDesugaringEnabled = true
        sourceCompatibility = JavaVersion.VERSION_11
        targetCompatibility = JavaVersion.VERSION_11
    }

    kotlinOptions {
        jvmTarget = "11"
    }

    defaultConfig {
        applicationId = "com.stepbattle.stepbattle"
        minSdk = 26
        // Explicit 36 instead of `flutter.targetSdkVersion` (which is 35 on
        // the pinned Flutter 3.27.1). Required by Play Console 2026-09-04.
        targetSdk = 36
        versionCode = flutter.versionCode
        versionName = flutter.versionName
        multiDexEnabled = true
    }

    signingConfigs {
        release {
            keyAlias = keystoreProperties['keyAlias']
            keyPassword = keystoreProperties['keyPassword']
            storeFile = keystoreProperties['storeFile'] ? file(keystoreProperties['storeFile']) : null
            storePassword = keystoreProperties['storePassword']
        }
    }

    buildTypes {
        release {
            signingConfig = signingConfigs.release
            minifyEnabled = true
            shrinkResources = true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

flutter {
    source = "../.."
}

// -----------------------------------------------------------------------------
// AndroidX WorkManager dedupe.
//
// home_widget → androidx.glance:glance-appwidget:1.0.0 pulls
// `androidx.work:work-runtime-ktx:2.7.1`. Our other plugins (workmanager +
// flutter_foreground_task) pull `androidx.work:work-runtime:2.8.1`, where
// the KTX classes (`OneTimeWorkRequestKt`, `PeriodicWorkRequestKt`, etc.)
// have been merged into the runtime jar. The result is a duplicate-class
// build error: same FQNs appear in both jars.
//
// Fix: globally exclude the legacy ktx artifact. Code that was relying on
// the KTX extensions still finds them, because the same APIs ship inside
// work-runtime 2.8+.
// -----------------------------------------------------------------------------
configurations.all {
    exclude group: 'androidx.work', module: 'work-runtime-ktx'
}

dependencies {
    // Required by `coreLibraryDesugaringEnabled = true` above. Version pin
    // follows the latest published by flutter_local_notifications' README.
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'
}
