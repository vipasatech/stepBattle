<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>splash native wordmark</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;900&display=swap"
      rel="stylesheet"
    />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 600px;
        height: 320px;
        background: transparent;
        overflow: hidden;
        font-family: 'Manrope', sans-serif;
      }
      .stage {
        width: 100%; height: 100%;
        position: relative;
        text-align: center;
      }
      /* Sizes intentionally larger than the Flutter widget's px values —
         this PNG gets scaled DOWN by Android to the branding-image slot
         (~200 dp wide). Final on-screen size lands close to Flutter's
         24sp / 11sp via a 3× supersample. */
      h1 {
        position: absolute;
        top: 80px;
        left: 0; right: 0;
        color: #FFFFFF;
        font-size: 72px;
        font-weight: 900;
        letter-spacing: 4.5px;
        line-height: 1;
        text-shadow: 0 4px 16px rgba(0,0,0,0.4);
      }
      p {
        position: absolute;
        top: 180px;
        left: 0; right: 0;
        color: rgba(255,255,255,0.85);
        font-size: 32px;
        font-weight: 500;
        letter-spacing: 3px;
        line-height: 1;
      }
    </style>
  </head>
  <body>
    <div class="stage">
      <h1>StepBattle</h1>
      <p>Every step counts.</p>
    </div>
  </body>
</html>
