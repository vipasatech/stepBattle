<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>splash native wordmark</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 600px;
        height: 320px;
        background: transparent;
        overflow: hidden;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          "Helvetica Neue", Arial, sans-serif;
      }
      .stage {
        width: 100%; height: 100%;
        position: relative;
        text-align: center;
      }
      h1 {
        position: absolute;
        top: 80px;
        left: 0; right: 0;
        color: #FFFFFF;
        font-size: 72px;
        font-weight: 900;
        letter-spacing: 5px;
        line-height: 1;
        text-shadow: 0 4px 16px rgba(0,0,0,0.4);
      }
      p {
        position: absolute;
        top: 188px;
        left: 0; right: 0;
        color: rgba(255,255,255,0.85);
        font-size: 26px;
        font-weight: 500;
        letter-spacing: 3px;
        line-height: 1;
      }
    </style>
  </head>
  <body>
    <div class="stage">
      <h1>StepBattle</h1>
      <p>Every step counts.</p>
    </div>
  </body>
</html>
