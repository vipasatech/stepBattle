<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>splash native icon</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 1080px;
        height: 1080px;
        background: transparent;
        overflow: hidden;
      }
      .stage {
        position: relative;
        width: 1080px;
        height: 1080px;
      }

      /* Three concentric rings — sized to match the Flutter splash widget
         at t=0 of its pulse cycle. Container in Flutter is 220dp;
         scale formula `0.75 + phase * 0.30` gives:
            ring 0 (phase 0/3):   scale 0.75, opacity 0.55
            ring 1 (phase 1/3):   scale 0.85, opacity 0.37
            ring 2 (phase 2/3):   scale 0.95, opacity 0.18
         At a 1080px canvas, that becomes 810 / 918 / 1026 px diameters
         — TIGHT around the logo, matching the native-side feel. */
      .ring {
        position: absolute;
        top: 50%; left: 50%;
        border-radius: 50%;
        border: 8px solid rgba(255,255,255,1);
        transform: translate(-50%, -50%);
      }
      .ring-1 { width: 810px;  height: 810px;  opacity: 0.55; }
      .ring-2 { width: 918px;  height: 918px;  opacity: 0.367; }
      .ring-3 { width: 1026px; height: 1026px; opacity: 0.183; }

      /* Circular logo. Flutter renders 160dp inside a 220dp container —
         logo:canvas ratio = 0.73. On a 1080px canvas → 788px. */
      .logo {
        position: absolute;
        top: 50%; left: 50%;
        width: 788px;
        height: 788px;
        transform: translate(-50%, -50%);
        border-radius: 50%;
        overflow: hidden;
        box-shadow: 0 60px 120px rgba(0,0,0,0.25);
      }
      .logo img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }
    </style>
  </head>
  <body>
    <div class="stage">
      <div class="ring ring-3"></div>
      <div class="ring ring-2"></div>
      <div class="ring ring-1"></div>
      <div class="logo">
        <img src="../../assets/logos/logo_square.png" />
      </div>
    </div>
  </body>
</html>
