<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>splash native icon</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 1080px;
        height: 1080px;
        background: transparent;
        overflow: hidden;
      }
      .stage {
        position: relative;
        width: 1080px;
        height: 1080px;
      }

      /* Three concentric rings — matching the FIRST FRAME of the Flutter
         splash's pulse animation (t=0). Phase formula in splash_screen.dart:
            phase  = (0 + i/3) % 1
            scale  = 0.55 + phase * 0.95
            opacity = (1 - phase) * 0.55
         Container in Flutter is 280dp; pixel sizes scale to fill 1080px. */
      .ring {
        position: absolute;
        top: 50%; left: 50%;
        border-radius: 50%;
        border: 8px solid rgba(255,255,255,1);
        transform: translate(-50%, -50%);
      }
      .ring-1 { width: 594px;  height: 594px;  opacity: 0.55; } /* phase 0.00 */
      .ring-2 { width: 939px;  height: 939px;  opacity: 0.367; } /* phase 0.33 */
      .ring-3 { width: 1273px; height: 1273px; opacity: 0.183; } /* phase 0.67 */

      /* Circular logo, same 160dp size as Flutter ⇒ ~576px at 3x.
         Drop shadow matches splash_screen.dart's BoxShadow. */
      .logo {
        position: absolute;
        top: 50%; left: 50%;
        width: 576px;
        height: 576px;
        transform: translate(-50%, -50%);
        border-radius: 50%;
        overflow: hidden;
        box-shadow: 0 44px 86px rgba(0,0,0,0.25);
      }
      .logo img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }
    </style>
  </head>
  <body>
    <div class="stage">
      <div class="ring ring-3"></div>
      <div class="ring ring-2"></div>
      <div class="ring ring-1"></div>
      <div class="logo">
        <img src="../../assets/logos/logo_square.png" />
      </div>
    </div>
  </body>
</html>
