name: stepbattle
description: "StepBattle — Fitness gamification app"
publish_to: 'none'
version: 1.1.6+36

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Routing
  go_router: ^14.8.1

  # Firebase — trimmed to the minimum needed. Auth flows through
  # supabase_flutter (Google/Apple via signInWithIdToken); data lives
  # in Supabase; storage lives in Supabase Storage. FCM stays for push.
  firebase_core: ^3.12.1
  firebase_messaging: ^15.2.4
  # google_sign_in still needed as the ID-token provider that we pass
  # into Supabase's signInWithIdToken (not into firebase_auth).
  google_sign_in: ^6.2.2

  # Health Data
  health: ^11.1.0
  pedometer: ^4.0.2

  # Permissions
  permission_handler: ^11.3.1

  # Background Tasks
  #  • workmanager   — periodic headless sync; the only thing that can run
  #                    while the app is fully terminated (best-effort, >=15min).
  #  • flutter_foreground_task — persistent foreground service that keeps
  #                    syncing steps while a battle is active and the app is
  #                    backgrounded (reliable, fine-grained cadence).
  workmanager: ^0.5.2
  flutter_foreground_task: ^8.17.0

  # Home-screen widget — Dart pushes a few SharedPreferences keys and triggers
  # an Android widget update; the widget itself is native XML + Kotlin.
  home_widget: ^0.7.0

  # Secondary persistent notifications. The foreground service's notification
  # is the daily summary; this plugin posts the battle and track notifications
  # ON TOP of it (separate channels, separate ids, separate dismiss handling).
  flutter_local_notifications: ^18.0.1

  # Local Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Maps & Location
  geolocator: ^13.0.2
  geocoding: ^3.0.0
  flutter_map: ^7.0.2
  latlong2: ^0.9.1

  # UI
  google_fonts: ^6.2.1
  cached_network_image: ^3.4.1
  intl: ^0.19.0
  shimmer: ^3.0.0
  # Fluent animation API. Powers the app-wide motion redesign: fade
  # / slide / scale / stagger primitives compose via `.animate()` and
  # `.effect()` chains, so per-widget AnimationControllers stay for the
  # handful of surfaces that need custom curves (streak flame bounce,
  # tick-ups). Every duration/curve reference resolves through
  # `lib/config/motion.dart` — do NOT hard-code Duration(...) inline.
  flutter_animate: ^4.5.0
  # Video playback — used by the splash screen to play the hyperframes-
  # rendered runner animation (assets/animations/splash_runner.mp4).
  video_player: ^2.9.0

  # Networking + device fingerprinting (used by Google Fit fallback +
  # source_step_hourly analytics logs)
  http: ^1.2.2
  device_info_plus: ^10.1.2
  package_info_plus: ^8.0.2

  # Supabase (running in parallel with Firestore during the migration —
  # see feature/supabase branch + supabase/migrations/).
  supabase_flutter: ^2.8.0
  flutter_dotenv: ^5.2.1

  # In-app XP purchases — Razorpay (India-native, ~2% MDR, native UPI).
  # Currently the DEFAULT provider (see PAYMENT_PROVIDER env flag in
  # lib/providers/payment_provider_provider.dart). Kept alive during
  # the Stripe cutover so v1.0.1+8 users still on Razorpay don't break.
  # See lib/services/razorpay_service.dart + supabase/functions/razorpay_*.
  razorpay_flutter: ^1.3.7

  # Second payment provider — Stripe. Enables multi-currency (INR + USD
  # + EUR + GBP + AUD) and international acceptance. Coexists with
  # Razorpay behind the PAYMENT_PROVIDER feature flag; ship-side we
  # flip to `stripe` once end-to-end verification passes. See
  # lib/services/stripe_service.dart + supabase/functions/stripe_*.
  flutter_stripe: ^11.5.0

  # Battle Status page (C.16): users can swap in their own photo as the
  # background. image_picker handles the gallery/camera selection.
  image_picker: ^1.1.2

  # Profile-photo crop step — after image_picker returns the raw file
  # we open the cropper to let the user frame it inside the avatar
  # circle before we upload. Ships native UIs on both platforms.
  image_cropper: ^8.0.2

  # Reactive network status. Used by the profile-photo pipeline to fire
  # `LocalProfilePhotoService.retryPendingUpload()` the moment WiFi /
  # mobile data comes back, so a photo picked while offline uploads on
  # its own without waiting for the next app-resume tick.
  connectivity_plus: ^6.0.5

  # Community Material Design Icons — bundles the ~6000-glyph MDI set so
  # we can use icons Flutter's built-in Material Icons doesn't ship, e.g.
  # `MdiIcons.swordCross` (the crossed-swords glyph used for the
  # Battles bottom-nav tab).
  material_design_icons_flutter: ^7.0.7296

  # QR code rendering — used in the Profile "Share my QR Code" bottom
  # sheet so friends can scan a code that contains the current user's
  # `userCode` (e.g. `#U4X92`). Pure-Dart, no native deps.
  qr_flutter: ^4.1.0

  # Native in-app review prompt for the Settings → "Rate the app" row.
  # Opens Google Play's in-app rating card without leaving the app on
  # Android; falls back to the store page listing when the API isn't
  # available. iOS uses SKStoreReviewController under the hood.
  in_app_review: ^2.0.9

  # `shared_preferences` — persists lightweight per-install state:
  # the profile-photo path picked in the profile screen, streak-strip
  # scroll offset, seen-onboarding flags, etc.
  shared_preferences: ^2.3.3
  # `flutter_svg` — used for a handful of SVG assets rendered inline
  # via `SvgPicture` (badge icons, etc.).
  flutter_svg: ^2.0.10+1

  # Share cards (Track session, Battle, Streak): render a custom card
  # widget off-screen to a PNG and hand it to the native share sheet.
  # `share_plus` is the share sheet itself; `path_provider` gives us the
  # cache dir to write the PNG to before sharing; `url_launcher` is the
  # fallback path to the Instagram Stories deeplink; `gal` writes the
  # PNG straight to the device Photos/Gallery for the "Save" action.
  share_plus: ^10.1.4
  path_provider: ^2.1.5
  url_launcher: ^6.3.1
  gal: ^2.3.1

  # Observability. Both packages are init'd in main.dart from .env values —
  # if the DSN / API key is unset ('changeme' placeholder), the SDKs no-op
  # rather than crash, so a dev environment without production secrets
  # still builds. See lib/services/observability_service.dart for the
  # gated init + wrapping of FlutterError.onError + PlatformDispatcher.
  sentry_flutter: ^8.11.0
  posthog_flutter: ^4.10.0

  # 3D character rendering — loads the .glb files under
  # assets/images/3dAvatars/{adam,amy,shannon,jackie}/character.glb (idle
  # pose) and Taunt.glb (taunt animation). Mixamo-rigged, Blender-converted
  # from FBX with Draco compression and 512-px textures (~2-7 MB each).
  # Handles model load, animation playback, and camera orbit inside a widget.
  flutter_3d_controller: ^2.0.5

  # WebView used by flutter_3d_controller under the hood. Declared as
  # a direct dep (in addition to the transitive one) so we can call
  # InAppWebViewController.getDefaultUserAgent() at splash to warm the
  # Android/iOS WebView provider — see MediaWarmup.primeWebViewEngine.
  # Version pin matches what the fork resolves.
  flutter_inappwebview: ^6.1.5
  android_alarm_manager_plus: 4.0.7

dependency_overrides:
  # Local fork of flutter_3d_controller — patches setCameraOrbit so its
  # radius argument is passed to model-viewer in **meters** (`10m`) instead
  # of the upstream's percentage-of-auto-frame (`10%`). The upstream
  # implementation makes it impossible to place the camera at an absolute
  # distance from the target, which we need to frame a specific spot in
  # our 200m-long arena. See packages/flutter_3d_controller_fork/lib/src/
  # data/datasources/flutter_3d_datasource_mobile.dart:137.
  flutter_3d_controller:
    path: packages/flutter_3d_controller_fork
  # image_cropper_platform_interface 7.2.0 uses `Color.toARGB32()`, which
  # wasn't added to the Flutter framework until 3.29. We're on 3.27.1, so
  # pin the interface at 7.1.0 (still uses `Color.value`) until we bump
  # Flutter. `image_cropper: ^8.0.2` remains compatible with 7.1.0.
  image_cropper_platform_interface: 7.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  riverpod_generator: ^2.6.3
  build_runner: ^2.4.14
  # Generates platform launcher icons from assets/logos/logo_square.png.
  # Run `dart run flutter_launcher_icons` after editing the config below.
  flutter_launcher_icons: ^0.14.1

# Launcher-icon generator config. The `image_path` is the source square PNG;
# the tool produces android/app/src/main/res/mipmap-*/ entries (and iOS
# equivalents) at build-time. `adaptive_icon_background` is the violet
# matching our brand for Android 8+ adaptive icons; the foreground reuses
# the same image so the runner sits on the violet plate.
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/logos/logo_square.png"
  min_sdk_android: 21
  adaptive_icon_background: "#7C3AED"
  adaptive_icon_foreground: "assets/logos/logo_square.png"

flutter:
  uses-material-design: true

  # Bundled geo boundaries — see assets/geo/README.md.
  # The placeholder ships an empty IN-districts.geojson; replace with real
  # data to enable district polygons on the cinematic map for Indian users.
  assets:
    - assets/geo/IN-districts.geojson
    - assets/logos/logo.png
    - assets/logos/logo_square.png
    - assets/animations/splash_runner.mp4
    # Battleground arena art — portrait 1:2 tiles, stacked vertically,
    # with the 14% top/bottom crop in `battle_ground_screen` to hide the
    # tile-seam empty band. Flutter's asset globbing does NOT recurse
    # into subfolders, so each pack subfolder is listed explicitly.
    # Time-of-day picked from the device clock (see BattlegroundTimeOfDay).
    #   • battleground/cityView/   — city tiles (morning/afternoon/
    #     evening/night). Only pack shipped today; forest was retired.
    - assets/images/battleground/
    - assets/images/battleground/cityView/
    - assets/images/horizontalBg/
    # 12 runner avatars (bird's-eye view to match the battleground camera).
    # Picked by the user in the avatar picker; stored as battle_avatar_id.
    - assets/images/avatars/
    # 3D character avatars — four Mixamo-rigged characters, each folder
    # holds character.glb (idle pose, shown in picker + arena for non-top
    # players) and Taunt.glb (taunt animation, shown in arena when this
    # user is #1 on the battle board). See lib/models/character_3d.dart
    # for the catalog and lib/sheets/character_3d_picker_sheet.dart for
    # the picker UI.
    - assets/images/3dAvatars/adam/
    - assets/images/3dAvatars/amy/
    - assets/images/3dAvatars/shannon/
    - assets/images/3dAvatars/jackie/
    # Welcome-screen carousel illustrations — the current live art the
    # Welcome screen renders. Sized 1080x2340 (9:19.5 aspect) so they
    # fit the phone-frame widget without cropping.
    # (Removed in 1.1.6+30: `assets/mockups/` was declared here as a
    # legacy "fallback source" but the fallback code path was deleted
    # long ago; grep confirmed no lib/ file references it. Removing
    # the declaration + folder shaves ~290 KB off the AAB with zero
    # runtime effect.)
    - assets/illustrations/
    - .env
