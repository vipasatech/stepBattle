name: stepbattle
description: "StepBattle — Fitness gamification app"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Routing
  go_router: ^14.8.1

  # Firebase
  firebase_core: ^3.12.1
  firebase_auth: ^5.5.1
  cloud_firestore: ^5.6.5
  google_sign_in: ^6.2.2
  firebase_messaging: ^15.2.4
  firebase_storage: ^12.4.4

  # Health Data
  health: ^11.1.0
  pedometer: ^4.0.2

  # Permissions
  permission_handler: ^11.3.1

  # Background Tasks
  #  • workmanager   — periodic headless sync; the only thing that can run
  #                    while the app is fully terminated (best-effort, >=15min).
  #  • flutter_foreground_task — persistent foreground service that keeps
  #                    syncing steps while a battle is active and the app is
  #                    backgrounded (reliable, fine-grained cadence).
  workmanager: ^0.5.2
  flutter_foreground_task: ^8.17.0

  # Home-screen widget — Dart pushes a few SharedPreferences keys and triggers
  # an Android widget update; the widget itself is native XML + Kotlin.
  home_widget: ^0.7.0

  # Secondary persistent notifications. The foreground service's notification
  # is the daily summary; this plugin posts the battle and track notifications
  # ON TOP of it (separate channels, separate ids, separate dismiss handling).
  flutter_local_notifications: ^18.0.1

  # Local Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Maps & Location
  geolocator: ^13.0.2
  geocoding: ^3.0.0
  flutter_map: ^7.0.2
  latlong2: ^0.9.1

  # UI
  google_fonts: ^6.2.1
  cached_network_image: ^3.4.1
  intl: ^0.19.0
  shimmer: ^3.0.0
  # Video playback — used by the splash screen to play the hyperframes-
  # rendered runner animation (assets/animations/splash_runner.mp4).
  video_player: ^2.9.0

  # Networking + device fingerprinting (used by Google Fit fallback +
  # source_step_hourly analytics logs)
  http: ^1.2.2
  device_info_plus: ^10.1.2
  package_info_plus: ^8.0.2

  # Supabase (running in parallel with Firestore during the migration —
  # see feature/supabase branch + supabase/migrations/).
  supabase_flutter: ^2.8.0
  flutter_dotenv: ^5.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  riverpod_generator: ^2.6.3
  build_runner: ^2.4.14
  # Generates platform launcher icons from assets/logos/logo_square.png.
  # Run `dart run flutter_launcher_icons` after editing the config below.
  flutter_launcher_icons: ^0.14.1

# Launcher-icon generator config. The `image_path` is the source square PNG;
# the tool produces android/app/src/main/res/mipmap-*/ entries (and iOS
# equivalents) at build-time. `adaptive_icon_background` is the violet
# matching our brand for Android 8+ adaptive icons; the foreground reuses
# the same image so the runner sits on the violet plate.
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/logos/logo_square.png"
  min_sdk_android: 21
  adaptive_icon_background: "#7C3AED"
  adaptive_icon_foreground: "assets/logos/logo_square.png"

flutter:
  uses-material-design: true

  # Bundled geo boundaries — see assets/geo/README.md.
  # The placeholder ships an empty IN-districts.geojson; replace with real
  # data to enable district polygons on the cinematic map for Indian users.
  assets:
    - assets/geo/IN-districts.geojson
    - assets/logos/logo.png
    - assets/logos/logo_square.png
    - assets/animations/splash_runner.mp4
    - .env
