name: stepbattle
description: "StepBattle — Fitness gamification app"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Routing
  go_router: ^14.8.1

  # Firebase
  firebase_core: ^3.12.1
  firebase_auth: ^5.5.1
  cloud_firestore: ^5.6.5
  google_sign_in: ^6.2.2
  firebase_messaging: ^15.2.4
  firebase_storage: ^12.4.4

  # Health Data
  health: ^11.1.0
  pedometer: ^4.0.2

  # Permissions
  permission_handler: ^11.3.1

  # Background Tasks
  #  • workmanager   — periodic headless sync; the only thing that can run
  #                    while the app is fully terminated (best-effort, >=15min).
  #  • flutter_foreground_task — persistent foreground service that keeps
  #                    syncing steps while a battle is active and the app is
  #                    backgrounded (reliable, fine-grained cadence).
  workmanager: ^0.5.2
  flutter_foreground_task: ^8.17.0

  # Home-screen widget — Dart pushes a few SharedPreferences keys and triggers
  # an Android widget update; the widget itself is native XML + Kotlin.
  home_widget: ^0.7.0

  # Secondary persistent notifications. The foreground service's notification
  # is the daily summary; this plugin posts the battle and track notifications
  # ON TOP of it (separate channels, separate ids, separate dismiss handling).
  flutter_local_notifications: ^18.0.1

  # Local Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Maps & Location
  geolocator: ^13.0.2
  geocoding: ^3.0.0
  flutter_map: ^7.0.2
  latlong2: ^0.9.1

  # UI
  google_fonts: ^6.2.1
  cached_network_image: ^3.4.1
  intl: ^0.19.0
  shimmer: ^3.0.0
  # Video playback — used by the splash screen to play the hyperframes-
  # rendered runner animation (assets/animations/splash_runner.mp4).
  video_player: ^2.9.0

  # Networking + device fingerprinting (used by Google Fit fallback +
  # source_step_hourly analytics logs)
  http: ^1.2.2
  device_info_plus: ^10.1.2
  package_info_plus: ^8.0.2

  # Supabase (running in parallel with Firestore during the migration —
  # see feature/supabase branch + supabase/migrations/).
  supabase_flutter: ^2.8.0
  flutter_dotenv: ^5.2.1

  # In-app XP purchases (migration 0016). ~2% MDR vs Play's 15–30% and
  # native UPI support; see lib/services/razorpay_service.dart for the
  # end-to-end flow + Edge Function spec.
  razorpay_flutter: ^1.3.7

  # Battle Status page (C.16): users can swap in their own photo as the
  # background. image_picker handles the gallery/camera selection.
  image_picker: ^1.1.2

  # Community Material Design Icons — bundles the ~6000-glyph MDI set so
  # we can use icons Flutter's built-in Material Icons doesn't ship, e.g.
  # `MdiIcons.swordCross` (the crossed-swords glyph used for the
  # Battles bottom-nav tab).
  material_design_icons_flutter: ^7.0.7296

  # Bitmoji-style character avatars — user picks face / hair / eyes /
  # mouth / clothing / accessories and the widget renders the result as
  # layered SVG. The chosen options are stored as a JSON spec on the
  # profile (see migration 0026), so a single ~200-byte column syncs
  # the whole look across devices without shipping PNGs.
  fluttermoji: ^1.0.2

  # Direct-use transitive deps of `fluttermoji` — we import them
  # ourselves in the customizer sheet (SharedPreferences to seed the
  # picker with the user's saved spec) and the FluttermojiAvatar
  # widget (SvgPicture.string to render other users' character rigs).
  # Explicit declaration keeps `depend_on_referenced_packages` clean
  # and pins the version range we've verified against.
  shared_preferences: ^2.3.3
  flutter_svg: ^2.0.10+1

  # Share cards (Track session, Battle, Streak): render a custom card
  # widget off-screen to a PNG and hand it to the native share sheet.
  # `share_plus` is the share sheet itself; `path_provider` gives us the
  # cache dir to write the PNG to before sharing; `url_launcher` is the
  # fallback path to the Instagram Stories deeplink; `gal` writes the
  # PNG straight to the device Photos/Gallery for the "Save" action.
  share_plus: ^10.1.4
  path_provider: ^2.1.5
  url_launcher: ^6.3.1
  gal: ^2.3.1

  # 3D character rendering — loads the .glb files under
  # assets/images/3dAvatars/{adam,amy,shannon,jackie}/character.glb (idle
  # pose) and Taunt.glb (taunt animation). Mixamo-rigged, Blender-converted
  # from FBX with Draco compression and 512-px textures (~2-7 MB each).
  # Handles model load, animation playback, and camera orbit inside a widget.
  flutter_3d_controller: ^2.0.5

dependency_overrides:
  # Local fork of flutter_3d_controller — patches setCameraOrbit so its
  # radius argument is passed to model-viewer in **meters** (`10m`) instead
  # of the upstream's percentage-of-auto-frame (`10%`). The upstream
  # implementation makes it impossible to place the camera at an absolute
  # distance from the target, which we need to frame a specific spot in
  # our 200m-long arena. See packages/flutter_3d_controller_fork/lib/src/
  # data/datasources/flutter_3d_datasource_mobile.dart:137.
  flutter_3d_controller:
    path: packages/flutter_3d_controller_fork

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  riverpod_generator: ^2.6.3
  build_runner: ^2.4.14
  # Generates platform launcher icons from assets/logos/logo_square.png.
  # Run `dart run flutter_launcher_icons` after editing the config below.
  flutter_launcher_icons: ^0.14.1

# Launcher-icon generator config. The `image_path` is the source square PNG;
# the tool produces android/app/src/main/res/mipmap-*/ entries (and iOS
# equivalents) at build-time. `adaptive_icon_background` is the violet
# matching our brand for Android 8+ adaptive icons; the foreground reuses
# the same image so the runner sits on the violet plate.
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/logos/logo_square.png"
  min_sdk_android: 21
  adaptive_icon_background: "#7C3AED"
  adaptive_icon_foreground: "assets/logos/logo_square.png"

flutter:
  uses-material-design: true

  # Bundled geo boundaries — see assets/geo/README.md.
  # The placeholder ships an empty IN-districts.geojson; replace with real
  # data to enable district polygons on the cinematic map for Indian users.
  assets:
    - assets/geo/IN-districts.geojson
    - assets/logos/logo.png
    - assets/logos/logo_square.png
    - assets/animations/splash_runner.mp4
    # Battleground arena art — portrait 1:2 tiles, stacked vertically,
    # with the 14% top/bottom crop in `battle_ground_screen` to hide the
    # tile-seam empty band. Flutter's asset globbing does NOT recurse
    # into subfolders, so each pack subfolder is listed explicitly.
    # Time-of-day picked from the device clock (see BattlegroundTimeOfDay).
    #   • battleground/cityView/   — city tiles (morning/afternoon/
    #     evening/night). Only pack shipped today; forest was retired.
    - assets/images/battleground/
    - assets/images/battleground/cityView/
    - assets/images/horizontalBg/
    # 12 runner avatars (bird's-eye view to match the battleground camera).
    # Picked by the user in the avatar picker; stored as battle_avatar_id.
    - assets/images/avatars/
    # 3D character avatars — four Mixamo-rigged characters, each folder
    # holds character.glb (idle pose, shown in picker + arena for non-top
    # players) and Taunt.glb (taunt animation, shown in arena when this
    # user is #1 on the battle board). See lib/models/character_3d.dart
    # for the catalog and lib/sheets/character_3d_picker_sheet.dart for
    # the picker UI.
    - assets/images/3dAvatars/adam/
    - assets/images/3dAvatars/amy/
    - assets/images/3dAvatars/shannon/
    - assets/images/3dAvatars/jackie/
    # Welcome-screen carousel mockups — one PNG per bottom-nav tab
    # (home / battles / track / clan / leaderboard). Drop screenshots
    # in here; the Welcome screen wires them into a floating phone
    # frame on a violet gradient.
    - assets/mockups/
    - .env
