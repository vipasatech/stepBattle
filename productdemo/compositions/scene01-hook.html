<template id="s1-template">
  <div data-composition-id="s1" data-width="1920" data-height="1080">
    <style>
      [data-composition-id="s1"] {
        width: 100%; height: 100%;
        background: radial-gradient(ellipse at 50% 60%, #2A1150 0%, #160B30 55%, #0A0614 100%);
        font-family: 'Space Grotesk', sans-serif;
        position: relative; overflow: hidden;
      }
      [data-composition-id="s1"] .glow-bottom {
        position: absolute; left: 50%; bottom: -260px; transform: translateX(-50%);
        width: 1500px; height: 850px;
        background: radial-gradient(ellipse, rgba(124,58,237,0.5) 0%, transparent 65%);
        filter: blur(70px); z-index: 0;
      }
      [data-composition-id="s1"] .stage {
        width: 100%; height: 100%;
        display: flex; align-items: center; justify-content: center;
        position: relative; z-index: 4; transform-origin: center center;
      }
      [data-composition-id="s1"] .headline {
        font-size: 120px; font-weight: 600; letter-spacing: -2px; line-height: 1.1;
        text-align: center; white-space: nowrap;
      }
      [data-composition-id="s1"] .w-done { color: #ffffff; }
      [data-composition-id="s1"] .w-active {
        background: linear-gradient(180deg, #D8B4FE 0%, #7C3AED 100%);
        -webkit-background-clip: text; background-clip: text;
        -webkit-text-fill-color: transparent; color: transparent;
        filter: drop-shadow(0 0 26px rgba(168,85,247,0.85));
      }
      [data-composition-id="s1"] .cursor {
        display: inline-block; width: 5px; height: 86px;
        background: #A855F7; box-shadow: 0 0 18px rgba(168,85,247,0.9);
        vertical-align: middle; margin-left: 8px; transform: translateY(-6px);
      }
    </style>

    <div class="glow-bottom"></div>
    <div class="stage" id="s1-stage">
      <div class="headline"><span id="s1-text"></span><span class="cursor" id="s1-cursor"></span></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      const fullText = "Still walking";
      const el = document.getElementById("s1-text");
      const words = []; (function(){ const re=/\S+/g; let m; while((m=re.exec(fullText))!==null){ words.push({start:m.index,end:m.index+m[0].length}); } })();
      function render(n){
        let frontier=-1; for(let i=0;i<words.length;i++){ if(words[i].start<n) frontier=i; else break; }
        let html=""; for(let i=0;i<=frontier;i++){ const wd=words[i]; const shown=fullText.slice(wd.start,Math.min(n,wd.end)); const cls=(i===frontier)?"w-active":"w-done"; if(i>0) html+=" "; html+='<span class="'+cls+'">'+shown+'</span>'; }
        el.innerHTML=html;
      }
      render(0);

      // zoom reaches 2.3 exactly at the 1.7s cut so it hands off seamlessly to s2's zoom-out
      tl.fromTo("#s1-stage", { scale: 2.15 }, { scale: 2.3, duration: 1.7, ease: "power1.inOut" }, 0);
      tl.to({}, { duration: 1.2, ease: "none", onUpdate: function(){ render(Math.round(this.progress()*fullText.length)); } }, 0.3);
      tl.call(()=>render(fullText.length), null, 1.5);
      tl.fromTo("#s1-cursor", { opacity: 1 }, { opacity: 0, duration: 0.35, repeat: 5, yoyo: true, ease: "steps(1)" }, 0);

      window.__timelines["s1"] = tl;
    </script>
  </div>
</template>
