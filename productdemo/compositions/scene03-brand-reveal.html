<template id="s3-template">
  <div data-composition-id="s3" data-width="1920" data-height="1080">
    <style>
      [data-composition-id="s3"] {
        width: 100%; height: 100%;
        background: radial-gradient(ellipse at 50% 55%, #2A1150 0%, #160B30 55%, #0A0614 100%);
        font-family: 'Space Grotesk', sans-serif;
        position: relative; overflow: hidden; perspective: 2000px;
      }
      [data-composition-id="s3"] .glow { position: absolute; left:50%; top:50%; width: 1100px; height: 1100px; margin-left:-550px; margin-top:-550px; border-radius:50%; background: radial-gradient(circle, rgba(124,58,237,0.42) 0%, transparent 60%); filter: blur(60px); z-index:0; }

      [data-composition-id="s3"] .stage { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:46px; z-index:5; }
      [data-composition-id="s3"] .hook { position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); font-size:120px; font-weight:600; letter-spacing:-2px; color:#fff; white-space:nowrap; z-index:7; }
      [data-composition-id="s3"] .hook b { background:linear-gradient(180deg,#D8B4FE,#7C3AED); -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent; font-weight:600; }

      [data-composition-id="s3"] .brand-row { display:flex; align-items:center; gap:34px; }
      [data-composition-id="s3"] .badge { position:relative; width:200px; height:200px; flex-shrink:0; }
      [data-composition-id="s3"] .badge .ring { position:absolute; left:50%; top:50%; border-radius:50%; border:2px solid rgba(168,85,247,0.5); transform:translate(-50%,-50%); }
      [data-composition-id="s3"] .badge .disc { position:absolute; left:50%; top:50%; width:150px; height:150px; margin-left:-75px; margin-top:-75px; border-radius:50%; background:radial-gradient(circle at 38% 30%, #A855F7 0%, #7C3AED 45%, #3B1A78 100%); box-shadow:0 18px 50px rgba(124,58,237,0.6), inset 0 2px 10px rgba(255,255,255,0.3); display:flex; align-items:center; justify-content:center; }
      [data-composition-id="s3"] .badge .disc svg { width:96px; height:96px; fill:#fff; filter: drop-shadow(0 3px 6px rgba(0,0,0,0.35)); }
      [data-composition-id="s3"] .word { font-size:130px; font-weight:700; letter-spacing:-3px; color:#fff; }
      [data-composition-id="s3"] .word .b { background:linear-gradient(180deg,#C9A6FF,#7C3AED); -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent; }

      [data-composition-id="s3"] .tag { font-family:'Manrope',sans-serif; font-size:34px; font-weight:600; letter-spacing:8px; text-transform:uppercase; color:#A78BC8; }
      [data-composition-id="s3"] .pill-wrap { padding:3px; border-radius:999px; background:linear-gradient(120deg,#7C3AED,#A855F7,#D8B4FE); box-shadow:0 0 50px rgba(124,58,237,0.45); }
      [data-composition-id="s3"] .pill { background:#0E0E10; padding:18px 44px; border-radius:999px; font-size:30px; font-weight:600; color:#fff; letter-spacing:4px; text-transform:uppercase; display:flex; align-items:center; gap:20px; }
      [data-composition-id="s3"] .pill .dot { color:rgba(168,85,247,0.7); font-size:11px; }
    </style>

    <div class="glow"></div>

    <div class="hook" id="s3-hook">Still walking <b>for nothing?</b></div>

    <div class="stage">
      <div class="brand-row">
        <div class="badge" id="s3-badge">
          <div class="ring" id="s3-r1" style="width:200px;height:200px;"></div>
          <div class="ring" id="s3-r2" style="width:200px;height:200px;"></div>
          <div class="ring" id="s3-r3" style="width:200px;height:200px;"></div>
          <div class="disc"><svg viewBox="0 0 24 24"><path d="M13.49 5.48c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zm-3.6 13.9l1-4.4 2.1 2v6h2v-7.5l-2.1-2 .6-3c1.3 1.5 3.3 2.5 5.5 2.5v-2c-1.9 0-3.5-1-4.3-2.4l-1-1.6c-.4-.6-1-1-1.7-1-.3 0-.5.1-.8.1L6.5 6.1V11h2V7.6l1.8-.7-1.6 8.1-4.9-1-.4 2 7 1.4z"/></svg></div>
        </div>
        <div class="word" id="s3-word">Step<span class="b">Battle</span></div>
      </div>
      <div class="tag" id="s3-tag">Every step counts.</div>
      <div class="pill-wrap" id="s3-pill"><div class="pill"><span id="s3-w1">Walk</span><span class="dot">●</span><span id="s3-w2">Battle</span><span class="dot">●</span><span id="s3-w3">Climb</span></div></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      gsap.set(["#s3-badge","#s3-word"], { autoAlpha: 0 });
      gsap.set("#s3-badge", { x: -360, filter: "blur(15px)", scale: 0.9 });
      gsap.set("#s3-word", { x: -460, filter: "blur(15px)", scale: 0.9 });
      gsap.set("#s3-tag", { autoAlpha: 0, y: 18 });
      gsap.set("#s3-pill", { autoAlpha: 0, scale: 0.85, y: 26 });
      gsap.set(["#s3-r1","#s3-r2","#s3-r3"], { scale: 0.7, opacity: 0 });

      // hook exits left
      tl.to("#s3-hook", { xPercent: -560, filter: "blur(20px)", opacity: 0, duration: 0.55, ease: "power3.in" }, 0.4);

      // badge + wordmark slam in from left
      tl.to("#s3-badge", { autoAlpha: 1, x: 0, filter: "blur(0px)", scale: 1.0, duration: 0.6, ease: "power3.out" }, 0.95);
      tl.to("#s3-word", { autoAlpha: 1, x: 0, filter: "blur(0px)", scale: 1.0, duration: 0.62, ease: "expo.out" }, 1.05);

      // radar rings pulse outward (looping-ish over the scene)
      [["#s3-r1",1.2],["#s3-r2",1.55],["#s3-r3",1.9]].forEach(([id,t])=>{
        tl.fromTo(id, { scale: 0.7, opacity: 0.8 }, { scale: 2.1, opacity: 0, duration: 1.6, ease: "power1.out" }, t);
      });
      tl.fromTo("#s3-r1", { scale: 0.7, opacity: 0.7 }, { scale: 2.1, opacity: 0, duration: 1.6, ease: "power1.out" }, 2.7);
      tl.fromTo("#s3-r2", { scale: 0.7, opacity: 0.7 }, { scale: 2.1, opacity: 0, duration: 1.6, ease: "power1.out" }, 3.0);

      // tagline + feature pill
      tl.to("#s3-tag", { autoAlpha: 1, y: 0, duration: 0.5, ease: "power3.out" }, 1.7);
      tl.to("#s3-pill", { autoAlpha: 1, scale: 1.0, y: 0, duration: 0.5, ease: "back.out(1.5)" }, 2.1);
      tl.from(["#s3-w1","#s3-w2","#s3-w3"], { autoAlpha: 0, scale: 0.6, stagger: 0.12, duration: 0.3, ease: "back.out(1.6)" }, 2.3);

      window.__timelines["s3"] = tl;
    </script>
  </div>
</template>
