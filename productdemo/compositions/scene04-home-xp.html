    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      gsap.set("#s4-world", { x: 60, scale: 1.06 });
      tl.from("#s4-phone", { x: -80, autoAlpha: 0, duration: 0.6, ease: "power3.out" }, 0);

      // step count ticks up 0 -> 8,420
      const stepsEl = document.getElementById("s4-steps");
      tl.to({v:0}, { v:8420, duration:1.6, ease:"power2.out", onUpdate:function(){ stepsEl.textContent = Math.round(this.targets()[0].v).toLocaleString(); } }, 0.4);

      // XP bar fills then LEVEL UP
      tl.to("#s4-xpfill", { width:"100%", duration:1.4, ease:"power2.inOut" }, 1.0);
      tl.to("#s4-togo", { textContent:"0 XP to go", duration:0.1 }, 2.4);
      tl.to("#s4-lvlup", { opacity:1, duration:0.25, ease:"power2.out" }, 2.5);
      tl.fromTo("#s4-lvlup span", { scale:0.5, opacity:0 }, { scale:1.0, opacity:1, duration:0.4, ease:"back.out(2)" }, 2.5);
      tl.to("#s4-lvlup", { opacity:0, duration:0.4, ease:"power2.in" }, 3.5);

      // captions
      tl.to("#s4-k", { opacity:1, duration:0.4 }, 0.5);
      tl.from("#s4-h", { autoAlpha:0, y:30, duration:0.6, ease:"power3.out" }, 0.7);
      tl.to("#s4-s", { opacity:1, duration:0.5 }, 1.3);

      // subtle camera drift
      tl.to("#s4-world", { x: -10, scale: 1.12, duration: 4.6, ease:"sine.inOut" }, 0.4);

      window.__timelines["s4"] = tl;
