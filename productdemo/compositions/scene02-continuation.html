<template id="s2-template">
  <div data-composition-id="s2" data-width="1920" data-height="1080">
    <style>
      [data-composition-id="s2"] {
        width: 100%; height: 100%;
        background: radial-gradient(ellipse at 50% 60%, #2A1150 0%, #160B30 55%, #0A0614 100%);
        font-family: 'Space Grotesk', sans-serif;
        position: relative; overflow: hidden; perspective: 2200px;
      }
      [data-composition-id="s2"] .glow-bottom {
        position: absolute; left: 50%; bottom: -260px; transform: translateX(-50%);
        width: 1500px; height: 850px;
        background: radial-gradient(ellipse, rgba(124,58,237,0.5) 0%, transparent 65%);
        filter: blur(70px); z-index: 0;
      }
      [data-composition-id="s2"] .field { position: absolute; inset: 0; transform-style: preserve-3d; z-index: 1; }
      [data-composition-id="s2"] .tilt { position: absolute; transform-style: preserve-3d; }
      [data-composition-id="s2"] .d-focal { filter: none; }
      [data-composition-id="s2"] .d-mid { filter: blur(1px); }
      [data-composition-id="s2"] .d-far { filter: blur(2.5px); }

      [data-composition-id="s2"] .chip {
        display: flex; align-items: center; gap: 10px;
        background: linear-gradient(180deg, rgba(40,26,70,0.85), rgba(24,14,46,0.85));
        border: 1px solid rgba(168,85,247,0.28); border-radius: 16px;
        padding: 12px 18px; box-shadow: 0 18px 44px rgba(0,0,0,0.5);
        font-family: 'Space Grotesk', sans-serif; white-space: nowrap;
      }
      [data-composition-id="s2"] .chip .ic { width: 30px; height: 30px; border-radius: 9px; background: linear-gradient(135deg,#7C3AED,#A855F7); display:flex; align-items:center; justify-content:center; color:#fff; flex-shrink:0; }
      [data-composition-id="s2"] .chip .ic svg { width: 18px; height: 18px; fill: #fff; }
      [data-composition-id="s2"] .chip .big { font-size: 22px; font-weight: 700; color: #fff; }
      [data-composition-id="s2"] .chip .sm { font-size: 12px; color: rgba(216,180,254,0.75); }
      [data-composition-id="s2"] .xp { background: linear-gradient(135deg, rgba(124,58,237,0.9), rgba(168,85,247,0.85)); border:none; color:#fff; font-weight:800; font-size:20px; padding:10px 18px; border-radius:999px; box-shadow:0 10px 30px rgba(124,58,237,0.55); }
      [data-composition-id="s2"] .ring { width: 78px; height: 78px; border-radius: 50%; border: 7px solid rgba(124,58,237,0.30); border-top-color: #A855F7; box-shadow: 0 0 24px rgba(168,85,247,0.4); }
      [data-composition-id="s2"] .foot { color: rgba(168,85,247,0.55); font-size: 46px; }

      [data-composition-id="s2"] .stage { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; position: relative; z-index: 4; transform-origin: center center; }
      [data-composition-id="s2"] .headline { font-size: 120px; font-weight: 600; letter-spacing: -2px; line-height: 1.14; text-align: center; max-width: 1500px; padding: 0 60px; }
      [data-composition-id="s2"] .w-done { color: #ffffff; }
      [data-composition-id="s2"] .w-active { background: linear-gradient(180deg, #D8B4FE 0%, #7C3AED 100%); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; color: transparent; filter: drop-shadow(0 0 26px rgba(168,85,247,0.85)); }
      [data-composition-id="s2"] .cursor { display: inline-block; width: 5px; height: 96px; background: #A855F7; box-shadow: 0 0 18px rgba(168,85,247,0.9); vertical-align: middle; margin-left: 8px; transform: translateY(-6px); }
    </style>

    <div class="glow-bottom"></div>

    <div class="field" id="s2-field">
      <div class="tilt" style="left:150px; top:120px; transform:rotateY(-6deg) rotateX(4deg);"><div class="chip d-focal"><div class="ic"><svg viewBox="0 0 24 24"><path d="M13.49 5.48c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zm-3.6 13.9l1-4.4 2.1 2v6h2v-7.5l-2.1-2 .6-3c1.3 1.5 3.3 2.5 5.5 2.5v-2c-1.9 0-3.5-1-4.3-2.4l-1-1.6c-.4-.6-1-1-1.7-1-.3 0-.5.1-.8.1L6.5 6.1V11h2V7.6l1.8-.7-1.6 8.1-4.9-1-.4 2 7 1.4z"/></svg></div><div><div class="big">8,420</div><div class="sm">steps today</div></div></div></div>
      <div class="tilt" style="left:470px; top:80px; transform:rotateY(-3deg);"><div class="xp d-mid">+10 XP</div></div>
      <div class="tilt" style="right:230px; top:110px; transform:rotateY(6deg) rotateX(4deg);"><div class="chip d-mid"><div class="ic"><svg viewBox="0 0 24 24"><path d="M13.49 5.48c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zm-3.6 13.9l1-4.4 2.1 2v6h2v-7.5l-2.1-2 .6-3c1.3 1.5 3.3 2.5 5.5 2.5v-2c-1.9 0-3.5-1-4.3-2.4l-1-1.6c-.4-.6-1-1-1.7-1-.3 0-.5.1-.8.1L6.5 6.1V11h2V7.6l1.8-.7-1.6 8.1-4.9-1-.4 2 7 1.4z"/></svg></div><div><div class="big">12,030</div><div class="sm">steps today</div></div></div></div>
      <div class="tilt" style="right:430px; top:240px; transform:rotateY(7deg);"><div class="ring d-far"></div></div>
      <div class="tilt" style="left:330px; top:300px;"><div class="foot d-far">👣</div></div>

      <div class="tilt" style="left:120px; bottom:140px; transform:rotateY(-6deg) rotateX(-4deg);"><div class="chip d-mid"><div class="ic"><svg viewBox="0 0 24 24"><path d="M13.49 5.48c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zm-3.6 13.9l1-4.4 2.1 2v6h2v-7.5l-2.1-2 .6-3c1.3 1.5 3.3 2.5 5.5 2.5v-2c-1.9 0-3.5-1-4.3-2.4l-1-1.6c-.4-.6-1-1-1.7-1-.3 0-.5.1-.8.1L6.5 6.1V11h2V7.6l1.8-.7-1.6 8.1-4.9-1-.4 2 7 1.4z"/></svg></div><div><div class="big">5,210</div><div class="sm">steps today</div></div></div></div>
      <div class="tilt" style="left:470px; bottom:170px;"><div class="xp d-far">+75 XP</div></div>
      <div class="tilt" style="right:200px; bottom:130px; transform:rotateY(6deg) rotateX(-4deg);"><div class="chip d-focal"><div class="ic"><svg viewBox="0 0 24 24"><path d="M13.49 5.48c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zm-3.6 13.9l1-4.4 2.1 2v6h2v-7.5l-2.1-2 .6-3c1.3 1.5 3.3 2.5 5.5 2.5v-2c-1.9 0-3.5-1-4.3-2.4l-1-1.6c-.4-.6-1-1-1.7-1-.3 0-.5.1-.8.1L6.5 6.1V11h2V7.6l1.8-.7-1.6 8.1-4.9-1-.4 2 7 1.4z"/></svg></div><div><div class="big">9,980</div><div class="sm">steps today</div></div></div></div>
      <div class="tilt" style="right:470px; bottom:230px;"><div class="foot d-far">👣</div></div>
    </div>

    <div class="stage" id="s2-stage">
      <div class="headline"><span id="s2-text"></span><span class="cursor" id="s2-cursor"></span></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      const el = document.getElementById("s2-text");
      function buildWords(t){ const w=[]; const re=/\S+/g; let m; while((m=re.exec(t))!==null){ w.push({start:m.index,end:m.index+m[0].length}); } return w; }
      function render(text, words, n){
        let frontier=-1; for(let i=0;i<words.length;i++){ if(words[i].start<n) frontier=i; else break; }
        let html=""; for(let i=0;i<=frontier;i++){ const wd=words[i]; const shown=text.slice(wd.start,Math.min(n,wd.end)); const cls=(i===frontier)?"w-active":"w-done"; if(i>0) html+=" "; html+='<span class="'+cls+'">'+shown+'</span>'; }
        el.innerHTML=html;
      }
      const p1 = "Still walking for nothing?"; const p1w = buildWords(p1);
      const startedAt = "Still walking".length;
      render(p1, p1w, startedAt);

      tl.fromTo("#s2-stage", { scale: 2.3 }, { scale: 1.0, duration: 1.1, ease: "power2.out" }, 0);
      tl.set("#s2-field", { opacity: 0 }, 0);
      tl.fromTo("#s2-field", { opacity: 0, scale: 1.08 }, { opacity: 1, scale: 1.0, duration: 0.7, ease: "power2.out" }, 0.3);

      tl.to({}, { duration: 1.0, ease: "none", onUpdate: function(){ const n = startedAt + Math.round(this.progress() * (p1.length - startedAt)); render(p1, p1w, n); } }, 0.2);
      tl.call(()=>render(p1, p1w, p1.length), null, 1.25);
      tl.fromTo("#s2-cursor", { opacity: 1 }, { opacity: 0, duration: 0.35, repeat: 9, yoyo: true, ease: "steps(1)" }, 0);

      window.__timelines["s2"] = tl;
    </script>
  </div>
</template>
