          <div class="disc"><svg viewBox="0 0 24 24"><path d="M13.49 5.48c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zm-3.6 13.9l1-4.4 2.1 2v6h2v-7.5l-2.1-2 .6-3c1.3 1.5 3.3 2.5 5.5 2.5v-2c-1.9 0-3.5-1-4.3-2.4l-1-1.6c-.4-.6-1-1-1.7-1-.3 0-.5.1-.8.1L6.5 6.1V11h2V7.6l1.8-.7-1.6 8.1-4.9-1-.4 2 7 1.4z"/></svg></div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      // brand close starts hidden, off-left (slam-in like the brand reveal)
      gsap.set("#s9-badge", { autoAlpha:0, x:-360, filter:"blur(15px)", scale:0.9 });
      gsap.set("#s9-word", { autoAlpha:0, x:-460, filter:"blur(15px)", scale:0.9 });
      gsap.set("#s9-tag", { autoAlpha:0, y:18 });
      gsap.set("#s9-cta", { autoAlpha:0, y:24 });
      gsap.set(["#s9-r1","#s9-r2"], { scale:0.7, opacity:0 });

      // outcome line reveal + hold
      tl.from("#s9-outcome .t", { autoAlpha:0, scale:0.85, y:40, duration:0.6, ease:"back.out(1.4)" }, 0);

      // push left + brand slams in
      tl.to("#s9-outcome", { xPercent:-560, filter:"blur(18px)", opacity:0, duration:0.5, ease:"power3.in" }, 2.4);
      tl.to("#s9-badge", { autoAlpha:1, x:0, filter:"blur(0px)", scale:1.0, duration:0.55, ease:"power3.out" }, 2.7);
      tl.to("#s9-word", { autoAlpha:1, x:0, filter:"blur(0px)", scale:1.0, duration:0.58, ease:"expo.out" }, 2.8);
      tl.to("#s9-tag", { autoAlpha:1, y:0, duration:0.45, ease:"power3.out" }, 3.2);
      tl.to("#s9-cta", { autoAlpha:1, y:0, duration:0.45, ease:"back.out(1.5)" }, 3.5);

      // radar pulses through the hold
      [["#s9-r1",3.0],["#s9-r2",3.4],["#s9-r1",4.2],["#s9-r2",4.8],["#s9-r1",5.4]].forEach(([id,t])=>{
        tl.fromTo(id, { scale:0.7, opacity:0.7 }, { scale:2.2, opacity:0, duration:1.6, ease:"power1.out" }, t);
      });

      window.__timelines["s9"] = tl;
    </script>
